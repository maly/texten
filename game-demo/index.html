<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farma Gordona — TEXTEN demo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #0a0a0f;
        color: #c8c8c8;
        font-family: "Courier New", Courier, monospace;
        font-size: 15px;
        line-height: 1.5;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 1rem;
      }

      #screen {
        width: 100%;
        max-width: 700px;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #header {
        padding: 0.3rem 0;
        border-bottom: 1px solid #333;
        margin-bottom: 0.5rem;
        font-size: 0.75rem;
        color: #555;
        display: flex;
        justify-content: space-between;
      }

      #terminal {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem 0;
      }

      /* Display lines */
      #terminal .line         { min-height: 1.5em; white-space: pre-wrap; }
      #terminal .text-yellow  { color: #e8c840; }
      #terminal .text-green   { color: #50d870; }
      #terminal .text-red     { color: #e85050; }
      #terminal .text-blue    { color: #5090e8; }
      #terminal .text-cyan    { color: #40d8d8; }
      #terminal .text-dim     { color: #555; }

      #input-area {
        border-top: 1px solid #333;
        padding: 0.5rem 0;
        margin-top: 0.5rem;
      }

      #buffer {
        color: #e8c840;
        min-height: 1.5em;
        white-space: pre;
      }

      #hint {
        font-size: 0.7rem;
        color: #444;
        margin-top: 0.2rem;
      }
    </style>
  </head>
  <body>
    <div id="screen">
      <div id="header">
        <span>TEXTEN engine demo — Farma Gordona</span>
        <span>nápověda: zadej <em>nápověda</em></span>
      </div>
      <div id="terminal"></div>
      <div id="input-area">
        <div id="buffer">&gt; _</div>
        <div id="hint">Piš příkazy, Enter = odeslat, ↑ = opakovat</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
